<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scoreboard Display</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="display-page">
  <div class="display-header">
    <div class="miniBoutHide">
      <h1>
        Round: <div id="roundNumDisplay">1</div>
      </h1>
    </div>
    <div>
      <h2><img class="displayimg" src="/images/rrd-logo-long.png" alt="Rockstar Roller Derby" />
      </h2>
    </div>
    <div class="miniBoutHide">
      <h1>
        Jam: <div id="jamNumDisplay">12</div>
      </h1>
    </div>
  </div>
  <div class="scoreboard miniBoutHide">
    <div class="teamgrid">
      <div id="team1Section" class="team">
        <div class="teamLogo" id="team1Logo"></div>
        <h2 id="team1-name">Team 1</h2>
        <h1 id="team1-score">0</h1>
      </div>

      <div id="team2Section" class="team">
        <div class="teamLogo" id="team2Logo"></div>
        <h2 id="team2-name">Team 2</h2>
        <h1 id="team2-score">0</h1>
      </div>
    </div>
  </div>

  <div id="mini-bout-results-wrapper">
    <div id="mini-bout-results">
      <!-- Bout 1 -->
      <div id="mini-bout-rm-xf" class="mini-bout-block">
        <div class="mini-bout-team-block green">
          <div class="mini-bout-team-name"><span class="name-full">Riotmakers</span><span class="name-short">RM</span></div>
          <div id="rmxfrm" class="mini-bout-team-score">0</div>
        </div>
        <div class="mini-bout-vs" aria-hidden="true">–</div>
        <div class="mini-bout-team-block yellow">
          <div class="mini-bout-team-name"><span class="name-full">X Force</span><span class="name-short">XF</span></div>
          <div id="rmxfxf" class="mini-bout-team-score">0</div>
        </div>
      </div>

      <!-- Bout 2 -->
      <div id="mini-bout-rm-tp" class="mini-bout-block">
        <div class="mini-bout-team-block green">
          <div class="mini-bout-team-name"><span class="name-full">Riotmakers</span><span class="name-short">RM</span></div>
          <div id="rmtprm" class="mini-bout-team-score">0</div>
        </div>
        <div class="mini-bout-vs" aria-hidden="true">–</div>
        <div class="mini-bout-team-block purple">
          <div class="mini-bout-team-name"><span class="name-full">Thrash Pandas</span><span class="name-short">TP</span></div>
          <div id="rmtptp" class="mini-bout-team-score">0</div>
        </div>
      </div>

      <!-- Bout 3 -->
      <div id="mini-bout-tp-xf" class="mini-bout-block">
        <div class="mini-bout-team-block purple">
          <div class="mini-bout-team-name"><span class="name-full">Thrash Pandas</span><span class="name-short">TP</span></div>
          <div id="tpxftp" class="mini-bout-team-score">0</div>
        </div>
        <div class="mini-bout-vs" aria-hidden="true">–</div>
        <div class="mini-bout-team-block yellow">
          <div class="mini-bout-team-name"><span class="name-full">X Force</span><span class="name-short">XF</span></div>
          <div id="tpxfxf" class="mini-bout-team-score">0</div>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="timer.js"></script>
  <script type="module" src="shot-clock.js"></script>
  <script type="module" src="display.js"></script>
</body>
</html>
