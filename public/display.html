<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scoreboard Display</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.0.0"></script>

  </head>
  <body>
    <div class="display-header">
      <div>
        <h1>
          Quarter: <div id="roundNumDisplay">1</div>
        </h1>
      </div>
      <div>
        <h2><img class="displayimg" src="/images/rrd-logo-long.png" alt="Rockstar Roller Derby" />
        </h2>
      </div>
      <div>
        <h1>
          Jam: <div id="jamNumDisplay">12</div>
        </h1>
      </div>
    </div>
    <div class="scoreboard">

      <div id="coffin-logos">
        <div class="coffin-logo">
          <img id="blade" src="/images/blade-coffin.png" alt="Blade" />
        </div>
        <div class="coffin-logo">
          <img id="true-blood" src="/images/true-blood-coffin.png" alt="True Blood" />
        </div>
        <div class="coffin-logo">
          <img id="twilight" src="/images/twilight-coffin.png" alt="Twilight" />
        </div>
        <div class="coffin-logo">
          <img id="vampire-chronicles" src="/images/vampire-chronicles-coffin.png" alt="Vampire Chronicles" />
        </div>
        <div class="coffin-logo">
          <img id="wwdits" src="/images/wwdits-coffin.png" alt="What We Do In The Shadows" />
        </div>
      </div>

      <div id="chart-wrapper-div"><canvas id="vamparty-scores"></canvas></div>

    </div>

    <script src="display.js"></script>
  </body>
</html>
