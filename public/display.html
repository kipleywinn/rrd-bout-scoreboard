<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scoreboard Display</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="display-header">
      <div>
        <h1>
          Round: <div id="roundNumDisplay">1</div>
        </h1>
      </div>
      <div>
        <h2><img class="displayimg" src="/images/rrd-logo-long.png" alt="Rockstar Roller Derby" /></h2>
      </div>
      <div>
        <h1>
          Jam: <div id="jamNumDisplay">1</div>
        </h1>
      </div>
    </div>
    <div class="scoreboard">
      <div class="teamgrid">

        <div id="team1Section" class="team">
          <h2 id="team1-name">Payback</h2>
          <h1 id="team1-score">0</h1>
        </div>

        <div id="team2Section" class="team">
          <h2 id="team2-name">First Blood</h2>
          <h1 id="team2-score">0</h1>
        </div>

        <div id="team3Section" class="team">
          <h2 id="team3-name">Street Fight</h2>
          <h1 id="team3-score">0</h1>
        </div>

      </div>
    </div>
    <script type="module" src="display.js"></script>
  </body>
</html>
