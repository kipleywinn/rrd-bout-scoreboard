<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scoreboard Controls</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="header">
     <img class="controlimg" src="/images/rrd-logo.png" alt="Rockstar Roller Derby" />
       <h2>Scoreboard Controls</h2>
    </div>
    <div class="other">
      <div class="buttons">
        <div class="teamSettings">
          <div class="scoreBoardControls">

            <div class="scoreBoardSetter">

              <div class="scoreBoardSetterB blade">
                <h2 id="display-team1-name-controls">Blade</h2>
                <div class="number-input">
                  <button id="minus1" onclick="this.parentNode.querySelector('input[type=number]').stepDown()" ></button>
                <input type="number" id="override-team1-score-input" value="0"/>
                <button id="plus1" onclick="this.parentNode.querySelector('input[type=number]').stepUp()" class="plus"></button>
                </div>
              </div>

              <div class="scoreBoardSetterB true-blood">
                <h2 id="display-team2-name-controls">True Blood</h2>
                <div class="number-input">
                  <button id="minus2" onclick="this.parentNode.querySelector('input[type=number]').stepDown()" ></button>
                <input type="number" id="override-team2-score-input" value="0" />
                  <button id="plus2" onclick="this.parentNode.querySelector('input[type=number]').stepUp()" class="plus"></button>
                </div>
              </div>

              <div class="scoreBoardSetterB twilight">
                <h2 id="display-team3-name-controls">Twilight</h2>
                <div class="number-input">
                  <button id="minus5" onclick="this.parentNode.querySelector('input[type=number]').stepDown()" ></button>
                  <input type="number" id="override-team3-score-input" value="0" />
                  <button id="plus5" onclick="this.parentNode.querySelector('input[type=number]').stepUp()" class="plus"></button>
                </div>
              </div>

              <div class="scoreBoardSetterB vampire-chronicles">
                <h2 id="display-team4-name-controls">Vampire Chronicles</h2>
                <div class="number-input">
                  <button id="minus6" onclick="this.parentNode.querySelector('input[type=number]').stepDown()" ></button>
                  <input type="number" id="override-team4-score-input" value="0" />
                  <button id="plus6" onclick="this.parentNode.querySelector('input[type=number]').stepUp()" class="plus"></button>
                </div>
              </div>

              <div class="scoreBoardSetterB wwdits">
                <h2 id="display-team5-name-controls">WWDITS</h2>
                <div class="number-input">
                  <button id="minus7" onclick="this.parentNode.querySelector('input[type=number]').stepDown()" ></button>
                  <input type="number" id="override-team5-score-input" value="0" />
                  <button id="plus7" onclick="this.parentNode.querySelector('input[type=number]').stepUp()" class="plus"></button>
                </div>
              </div>

            </div>

            <div class="roundJamControl">
              <div class="lineItem">
                <label for="roundNum">Quarter: </label>
                <div class="number-input">
                  <button id="minus3" onclick="this.parentNode.querySelector('input[type=number]').stepDown()" ></button>
                <input type="number" id="roundNum" name="roundNum" value="1" />
                  <button id="plus3" onclick="this.parentNode.querySelector('input[type=number]').stepUp()" class="plus"></button>
                </div>
              </div>
              <div class="lineItem">
                <label for="jamNum">Jam: </label>
                <div class="number-input">
                  <button id="minus4" onclick="this.parentNode.querySelector('input[type=number]').stepDown()" ></button>
                <input type="number" id="jamNum" name="jamNum" value="1" />
                  <button id="plus4" onclick="this.parentNode.querySelector('input[type=number]').stepUp()" class="plus"></button>
                </div>
              </div>
            </div>
            <div class="scoreBoardMisc">
              <button id="resetScore" onclick="resetScore()">
                Reset Score &amp; Round/Jam
              </button>
            </div>
          </div>
          
        </div>
        
        <div class="extraButtons">
          <div>
            <p>Refreshed the page? Data not loading automatically?</p>
            <button id="loadStoredData" onclick="fetchData()">
              Load Saved Data
            </button>
          </div>
        </div>

      </div>
    </div>

    <script src="control.js"></script>
  </body>
</html>
